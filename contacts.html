<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>Школа танцев | FUTURE SPACE</title>
  </head>
  <body>
    <div class="page">
      <header class="header" id="header">
        <div class="wrapper header__wrapper">
          <a href="#" class="header__logo-link">
            <img
              src="./assets/img/header-logo.svg"
              alt=""
              class="header__logo"
            />
            <span class="header__logo-text"> FUTURE SPACE </span>
          </a>
          <nav class="header__nav">
            <a href="#prices" class="header__nav-link"> Цены </a>
            <a href="#book" class="header__nav-link"> Расписание </a>
            <a href="#special" class="header__nav-link"> Направления </a>
            <a href="#contacts" class="header__nav-link"> Контакты </a>
          </nav>
          <div class="socials header__socials">
            <a href="#" class="socials__link header__socials-link">
              <img
                src="./assets/icons/inst-icon.svg"
                alt=""
                class="socials__link-icon header__socials-link-icon"
              />
            </a>
            <a href="#" class="socials__link header__socials-link">
              <img
                src="./assets/icons/vk-icon.svg"
                alt=""
                class="socials__link-icon header__socials-link-icon"
              />
            </a>
            <a href="#" class="socials__link header__socials-link">
              <img
                src="./assets/icons/tg-icon.svg"
                alt=""
                class="socials__link-icon header__socials-link-icon"
              />
            </a>
          </div>
        </div>
      </header>
      <main class="main">
        <section class="cont-section">
          <div class="wrapper cont-section__wrapper">
            <div class="cont-section__col">
              <div class="cont-section__col-item">
                <img
                  src="./assets/icons/tel-icon.svg"
                  alt=""
                  class="cont-section__col-item-icon"
                />
                <div class="cont-section__col-item-body">
                  <p class="cont-section__col-item-heading">Телефон:</p>
                  <a href="+79009009090" class="cont-section__col-item-link">
                    +7 (900) 900-90-90
                  </a>
                </div>
              </div>
              <div class="cont-section__col-item">
                <img
                  src="./assets/icons/mail-icon.svg"
                  alt=""
                  class="cont-section__col-item-icon"
                />
                <div class="cont-section__col-item-body">
                  <p class="cont-section__col-item-heading">Почта:</p>
                  <a
                    href="kroalls26@mail.ru"
                    class="cont-section__col-item-link"
                    >kroalls26@mail.ru</a
                  >
                </div>
              </div>
              <div class="socials header__socials">
                <a href="#" class="socials__link header__socials-link">
                  <img
                    src="./assets/icons/inst-icon.svg"
                    alt=""
                    class="socials__link-icon header__socials-link-icon"
                  />
                </a>
                <a href="#" class="socials__link header__socials-link">
                  <img
                    src="./assets/icons/vk-icon.svg"
                    alt=""
                    class="socials__link-icon header__socials-link-icon"
                  />
                </a>
                <a href="#" class="socials__link header__socials-link">
                  <img
                    src="./assets/icons/tg-icon.svg"
                    alt=""
                    class="socials__link-icon header__socials-link-icon"
                  />
                </a>
              </div>
            </div>
            <img
              src="./assets/img/cont-img.jpg"
              alt=""
              class="cont-section__img"
            />
          </div>
          <img src="./assets/img/cont-bg.svg" alt="" class="cont-section__bg" />
        </section>
      </main>
    </div>
  </body>
</html>
